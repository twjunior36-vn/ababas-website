<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <style>
      .logo-text { font-family: 'Quicksand', 'Montserrat', -apple-system, sans-serif; font-size: 64px; font-weight: 500; fill: #1A1A1A; letter-spacing: 6px; }
      .tagline-text { font-family: 'Montserrat', -apple-system, sans-serif; font-size: 13.5px; font-weight: 500; fill: #1A1A1A; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Wing / Wave Swoosh Symbol -->
  <g fill="#1A1A2E" transform="translate(0, -5)">
    <!-- Upper Swoosh -->
    <path d="M 160 85 C 150 72 165 48 190 42 C 215 36 240 50 262 90 C 235 72 210 55 188 56 C 172 57 163 70 160 85 Z" />
    <!-- Lower Swoosh -->
    <path d="M 152 108 C 148 95 158 84 175 79 C 195 74 216 83 234 103 C 214 93 194 88 178 90 C 165 92 156 100 152 108 Z" />
  </g>

  <!-- Brand Name: ababas -->
  <text x="200" y="165" text-anchor="middle" class="logo-text">ababas</text>

  <!-- Tagline: —— High Style, Low Effort, True Value —— -->
  <g transform="translate(0, 185)">
    <line x1="45" y1="-5" x2="88" y2="-5" stroke="#1A1A2E" stroke-width="1" />
    <text x="200" y="0" text-anchor="middle" class="tagline-text">High Style, Low Effort, True Value</text>
    <line x1="312" y1="-5" x2="355" y2="-5" stroke="#1A1A2E" stroke-width="1" />
  </g>
</svg>
