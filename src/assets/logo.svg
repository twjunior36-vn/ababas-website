<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="100%" height="100%">
  <defs>
    <style>
      .brand-wordmark {
        font-family: 'Quicksand', 'Montserrat', 'Century Gothic', -apple-system, sans-serif;
        font-size: 84px;
        font-weight: 700;
        fill: #1C1B1B;
        letter-spacing: 3px;
      }
      .brand-tagline {
        font-family: 'Montserrat', -apple-system, sans-serif;
        font-size: 17px;
        font-weight: 700;
        fill: #1C1B1B;
        letter-spacing: 1.8px;
      }
    </style>
  </defs>

  <!-- 1. Official Ababas Dual Wave Symbol (Centered Top) -->
  <g fill="#1C1B1B" transform="translate(-40, -18)">
    <!-- Top Arc Wave Stroke -->
    <path d="M 200 80 C 202 56 222 30 250 24 C 278 18 300 36 312 78 C 284 52 258 40 242 42 C 224 44 210 60 200 80 Z" />
    
    <!-- Bottom Swell Wave Stroke -->
    <path d="M 194 104 C 192 86 208 70 230 65 C 255 60 282 74 300 96 C 276 82 252 77 234 80 C 217 83 204 92 194 104 Z" />
  </g>

  <!-- 2. Wordmark: ababas (Centered, Bold & Clear) -->
  <text x="210" y="142" text-anchor="middle" class="brand-wordmark">ababas</text>

  <!-- 3. Tagline: —— High Style, Low Effort, True Value —— (Sharp & Legible) -->
  <g transform="translate(0, 175)">
    <line x1="22" y1="-6" x2="62" y2="-6" stroke="#1C1B1B" stroke-width="2.5" stroke-linecap="round" />
    <text x="210" y="0" text-anchor="middle" class="brand-tagline">High Style, Low Effort, True Value</text>
    <line x1="358" y1="-6" x2="398" y2="-6" stroke="#1C1B1B" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
