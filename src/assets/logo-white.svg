<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <style>
      .brand-wordmark-white {
        font-family: 'Quicksand', 'Montserrat', 'Century Gothic', -apple-system, sans-serif;
        font-size: 82px;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: 4px;
      }
      .brand-tagline-white {
        font-family: 'Montserrat', -apple-system, sans-serif;
        font-size: 18px;
        font-weight: 600;
        fill: #F4B6C1;
        letter-spacing: 2.5px;
      }
    </style>
  </defs>

  <!-- 1. Official Ababas Dual Wave Symbol (White) -->
  <g fill="#FFFFFF">
    <!-- Top Arc Wave Stroke -->
    <path d="M 195 95 C 198 68 220 38 252 30 C 285 24 310 44 322 92 C 290 62 262 48 244 50 C 224 52 206 72 195 95 Z" />
    
    <!-- Bottom Swell Wave Stroke -->
    <path d="M 188 122 C 186 102 205 84 230 78 C 258 72 288 88 308 114 C 280 98 254 92 234 96 C 215 99 200 110 188 122 Z" />
  </g>

  <!-- 2. Wordmark: ababas (Centered with Clear Vertical Breathing Room) -->
  <text x="250" y="215" text-anchor="middle" class="brand-wordmark-white">ababas</text>

  <!-- 3. Tagline: —— High Style, Low Effort, True Value —— (Enlarged & Legible) -->
  <g transform="translate(0, 265)">
    <line x1="38" y1="-6" x2="88" y2="-6" stroke="#F4B6C1" stroke-width="2" stroke-linecap="round" />
    <text x="250" y="0" text-anchor="middle" class="brand-tagline-white">High Style, Low Effort, True Value</text>
    <line x1="412" y1="-6" x2="462" y2="-6" stroke="#F4B6C1" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
